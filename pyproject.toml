[project]
name = "DifferentiableOptimizationCBF"
version = "1.1.0"
description = "Simulation Code for Differentiable Optimizer Based CBF"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Bolun Dai", email = "bd1555@nyu.edu" }]
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.24,<2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
  # Pinned to 0.6.2: later wheels (>=0.6.5) ship a broken macOS arm64 binary.
  # Their CI delocate step is missing — the .so links @rpath/libc++.1.dylib
  # against /Users/runner/miniconda3/... which doesn't exist on user machines.
  # 0.6.2 links against /usr/lib/libc++.1.dylib (absolute system path) and
  # works on macOS arm64 + Linux + Windows. Bump when upstream republishes.
  "proxsuite==0.6.2",
  "pin>=2.7,<3.0",
  # 4.0.0 has a sparse Cholesky bug that breaks the Newton solver (fixed in 4.0.1).
  "mujoco>=4.0.1,<5",
  "juliacall>=0.9.20",
  "tyro>=0.8",
  "fr3env @ git+https://github.com/BolunDai0216/FR3Env.git",
]

[project.urls]
Homepage = "https://github.com/BolunDai0216/DifferentiableOptimizationCBF"
Documentation = "https://differentiableoptimizationcbf.readthedocs.io/"

[project.scripts]
diffoptcbf-three-blocks = "DifferentiableOptimizationCBF.manipulator.manipulator_exp:three_blocks_main"
diffoptcbf-two-walls = "DifferentiableOptimizationCBF.manipulator.manipulator_exp:two_walls_main"
diffoptcbf-manipulator = "DifferentiableOptimizationCBF.manipulator.manipulator_exp:main"
diffoptcbf-unicycle = "DifferentiableOptimizationCBF.toy_example.unicycle_exp:main"

[project.optional-dependencies]
docs = [
  "sphinx>=7",
  "myst-parser",
  "nbsphinx",
  "sphinx_book_theme",
  "sphinx-autobuild",
  "sphinx-autoapi",
  "sphinxcontrib-youtube",
  "sphinx_design",
]

[dependency-groups]
dev = ["ruff>=0.6", "ipykernel", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
constraint-dependencies = ["urllib3>=2.7.0"]
# fr3env is only used for its robot description files (URDF, MJCF, meshes),
# but it declares the dependencies of its pybullet environments. Drop the
# ones that do not install everywhere and that nothing here imports:
# pybullet has no macOS wheels and fails to build on macOS arm64, ndcurves
# has no CPython 3.11 macOS arm64 wheel for its latest release.
exclude-dependencies = ["pybullet", "ndcurves"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/DifferentiableOptimizationCBF"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
